<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"></head><body><main><header><img src="icons/icon48.png" alt=""><div><h1>毒エロチワワ</h1><p>Doku / Ero dual binary</p></div></header><div id="status" class="status">状態確認中…</div><button id="prepare" class="primary">モデルを準備</button><button id="compose">投稿前チェックを開く</button><label class="toggle"><span>Xホバー判定</span><input id="hover" type="checkbox"></label><label class="toggle"><span>選択テキスト判定</span><input id="selection" type="checkbox"></label><label class="filter"><span>X表示モード</span><select id="xFilterMode"><option value="off">フィルタなし</option><option value="plain">チワワだけ表示</option><option value="doku">毒チワワ表示（毒エロ含む）</option><option value="ero">エロチワワ表示（毒エロ含む）</option><option value="both">毒エロチワワだけ表示</option></select></label><section><p>選択したグループ以外のXポストは、判定後に霧散して非表示になります。</p><p><span class="doku">毒</span>は紫、<span class="ero">エロ</span>はピンク。</p></section><button id="clear" class="subtle">モデルキャッシュを削除</button><footer>FP32 ONNX · kokuren/doku-ero-chiwawa-japanese</footer></main><script src="popup.js"></script></body></html>
